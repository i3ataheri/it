<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة عمل - ياسمين مودا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* پالت رنگی رز گلد و کرم لوکس */
            --bg-body: #f7ede2; /* کرم شیری */
            --card-bg: #fffbf7; /* سفید خیلی ملایم */
            --text-main: #ad1457; /* صورتی تیره (لمسات للأفراح) */
            --text-rose: #e6b8a2; /* طلایی رز (لوگو) */
            --text-gold: #d4af37; /* طلایی (ذرات) */
            --text-info: #444444; /* نوک مدادی تیره */
            --shadow: rgba(173, 20, 87, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
            overflow: hidden; /* جلوگیری از اسکرول */
        }

        /* --- لایه ذرات الماسی پس‌زمینه (اضافه شده) --- */
        .particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
            pointer-events: none; 
        }

        .particle {
            position: absolute;
            background-color: var(--text-gold);
            border-radius: 50%;
            opacity: 0;
            animation: sparkFall infinite linear;
            box-shadow: 0 0 5px rgba(212, 175, 55, 0.3);
        }

        /* انیمیشن سقوط و درخشش */
        @keyframes sparkFall {
            0% { top: -20px; opacity: 0; transform: scale(0.5); }
            10%, 90% { opacity: 0.8; transform: scale(1); }
            100% { top: 110vh; opacity: 0; transform: scale(0.7); }
        }

        /* تولید نمونه‌های ذرات با CSS */
        .particle:nth-child(1)  { width: 2px; height: 2px; left: 10%; animation-duration: 4s; animation-delay: 0s; }
        .particle:nth-child(2)  { width: 3px; height: 3px; left: 25%; animation-duration: 6s; animation-delay: 1.5s; }
        .particle:nth-child(3)  { width: 2px; height: 2px; left: 40%; animation-duration: 5s; animation-delay: 0.8s; }
        .particle:nth-child(4)  { width: 4px; height: 4px; left: 55%; animation-duration: 8s; animation-delay: 2.5s; }
        .particle:nth-child(5)  { width: 2px; height: 2px; left: 70%; animation-duration: 6.5s; animation-delay: 1s; }
        .particle:nth-child(6)  { width: 3px; height: 3px; left: 85%; animation-duration: 7.2s; animation-delay: 3s; }
        .particle:nth-child(7)  { width: 2px; height: 2px; left: 15%; animation-duration: 5s; animation-delay: 4.5s; }
        .particle:nth-child(8)  { width: 3px; height: 3px; left: 35%; animation-duration: 6.2s; animation-delay: 2s; }
        .particle:nth-child(9)  { width: 4px; height: 4px; left: 60%; animation-duration: 7.8s; animation-delay: 5s; }
        .particle:nth-child(10) { width: 2px; height: 2px; left: 75%; animation-duration: 5.5s; animation-delay: 3.5s; }
        .particle:nth-child(11) { width: 3px; height: 3px; left: 90%; animation-duration: 6s; animation-delay: 0.5s; }
        .particle:nth-child(12) { width: 2px; height: 2px; left: 5%; animation-duration: 4.5s; animation-delay: 6s; }
        .particle:nth-child(13) { width: 3px; height: 3px; left: 20%; animation-duration: 5.8s; animation-delay: 1.2s; }
        .particle:nth-child(14) { width: 4px; height: 4px; left: 30%; animation-duration: 7.5s; animation-delay: 2.2s; }
        .particle:nth-child(15) { width: 2px; height: 2px; left: 45%; animation-duration: 5s; animation-delay: 3.8s; }
        .particle:nth-child(16) { width: 3px; height: 3px; left: 65%; animation-duration: 6s; animation-delay: 2s; }
        .particle:nth-child(17) { width: 2px; height: 2px; left: 80%; animation-duration: 4.8s; animation-delay: 4.5s; }
        .particle:nth-child(18) { width: 3px; height: 3px; left: 95%; animation-duration: 5.2s; animation-delay: 5.5s; }
        .particle:nth-child(19) { width: 4px; height: 4px; left: 50%; animation-duration: 7s; animation-delay: 0.1s; }
        .particle:nth-child(20) { width: 2px; height: 2px; left: 2%; animation-duration: 5s; animation-delay: 2s; }
        .particle:nth-child(21) { width: 3px; height: 3px; left: 98%; animation-duration: 6.2s; animation-delay: 1s; }

        /* --- استایل ۳ بعدی کارت --- */
        .card-perspective {
            perspective: 1000px; /* ایجاد عمق برای افکت ۳ بعدی */
        }

        .yasmin-card {
            width: 320px; 
            height: 520px; 
            border-radius: 20px;
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(173, 20, 87, 0.1);
            position: relative;
            transform-style: preserve-3d; /* فعال کردن استایل ۳ بعدی */
            transition: transform 0.6s ease; /* انیمیشن نرم ۳ بعدی */
        }

        /* افکت ۳ بعدی در هاور */
        .yasmin-card:hover {
            transform: rotateY(-15deg) rotateX(8deg) translateY(-5px);
            box-shadow: 0 15px 40px rgba(173, 20, 87, 0.15);
        }

        /* حاشیه طلایی داخلی چرخشی */
        .yasmin-card::before {
            content: '';
            position: absolute;
            width: 130%; 
            height: 130%;
            background: conic-gradient(
                var(--text-gold), 
                rgba(212, 175, 55, 0.1), 
                var(--text-gold), 
                rgba(212, 175, 55, 0.1), 
                var(--text-gold)
            );
            animation: rotate-border 10s linear infinite; 
            z-index: 0;
            top: -15%;
            left: -15%;
        }

        @keyframes rotate-border {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .card-content {
            position: relative;
            width: calc(100% - 10px); 
            height: calc(100% - 10px);
            background-color: var(--card-bg);
            border-radius: 16px; 
            z-index: 1; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            text-align: center;
            backface-visibility: hidden; /* جلوگیری از دیدن پشت کارت در چرخش */
        }

        /* --- استایل لوگو و تایپوگرافی --- */
        .logo-section {
            margin-top: 15px;
            margin-bottom: 30px;
        }

        .logo-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid var(--text-rose);
            margin-bottom: 15px;
        }

        .logo-wrapper::before {
            content: '';
            position: absolute;
            width: 80%;
            height: 80%;
            border-radius: 50%;
            border: 1px dashed var(--text-gold);
            opacity: 0.5;
        }

        .logo-symbol {
            font-family: 'Great Vibes', cursive; /* فونت سرهم شیک */
            font-size: 70px;
            color: var(--text-rose); /* طلایی رز */
            line-height: 1;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        .brand-name {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 28px;
            color: var(--text-main); /* صورتی تیره */
            font-weight: 700;
        }

        .divider {
            width: 70%;
            height: 1.2px;
            background: linear-gradient(to right, transparent, var(--text-gold), transparent);
            margin: 15px 0 35px 0;
        }

        /* اطلاعات تماس مدرن */
        .contact-info {
            width: 100%;
            text-align: right;
            margin-bottom: auto;
        }

        .info-row {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            font-size: 14px;
            color: var(--info-text);
            border-bottom: 1px solid rgba(173, 20, 87, 0.05);
            padding-bottom: 5px;
        }

        .info-row span.label {
            color: var(--text-main);
            font-weight: 600;
            margin-left: 10px;
            min-width: 65px;
        }

        .info-row span.value {
            font-weight: 400;
            direction: ltr; 
        }

        .footer-note {
            font-size: 14px;
            color: var(--text-darker);
            font-weight: 700;
            font-style: italic;
            opacity: 0.9;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="particles-container">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="card-perspective">
        <div class="yasmin-card">
            <div class="card-content">
                
                <div class="logo-section">
                    <div class="logo-wrapper">
                        <span class="logo-symbol">YM</span> </div>
                    <h1 class="brand-name">ياسمين مودا</h1>
                </div>

                <div class="divider"></div>

                <div class="contact-info">
                    <div class="info-row">
                        <span class="label">ياسمين:</span> 
                        <span class="value">العنزي</span>
                    </div>
                    <div class="info-row">
                        <span class="label">الجوال:</span> 
                        <span class="value">+966 5XXXXXXX</span>
                    </div>
                    <div class="info-row">
                        <span class="label">البريد:</span> 
                        <span class="value">yasmin@moda.sa</span>
                    </div>
                    <div class="info-row">
                        <span class="label">الموقع:</span> 
                        <span class="value">الرياض - طريق العليا</span>
                    </div>
                </div>

                <div class="footer-note">
                    أناقة أنثوية تليق بكِ
                </div>
                
            </div>
        </div>
    </div>

</body>
</html>
