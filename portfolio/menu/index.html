<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض القوالب الرقمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Almarai:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
    <div class="nav-bar">
        <div class="top-btns">
            <a href="https://ta.mnu.workers.dev/" class="btn-nav"><i class="fas fa-user-circle"></i> الملف الشخصي</a>
            <a href="https://ta.mnu.workers.dev/portfolio/" class="btn-nav"><i class="fas fa-th-large"></i> معرض الأعمال</a>
        </div>
    </div>
    <h2 class="hero-title">معرض القوالب الرقمية</h2>
    <p class="hero-desc">تصفح أحدث التصاميم العصرية لعملك التجاري</p>
</section>

<div class="container">
    <div class="filter-box">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="ابحث عن تصميم (مثلاً: مطعم، فخم)...">
        </div>
        <div class="filter-group" id="filterGroup">
            <button class="f-btn active" data-cat="all"><i class="fas fa-border-all"></i> الكل</button>
            <button class="f-btn" data-cat="luxury"><i class="fas fa-crown"></i> فخامة</button>
            <button class="f-btn" data-cat="modern"><i class="fas fa-bolt"></i> مودرن</button>
            <button class="f-btn" data-cat="romantic"><i class="fas fa-heart"></i> رومانسي</button>
        </div>
    </div>

    <div class="grid" id="menuGrid">
        </div>
</div>

<div class="modal" id="menuModal">
    <div class="modal-body">
        <iframe src="" id="menuFrame"></iframe>
    </div>
    <button class="close-btn" onclick="closeMenu()">
        <i class="fas fa-times"></i>
    </button>
</div>

<script src="data.js"></script>
<script src="script.js"></script>

</body>
</html>
