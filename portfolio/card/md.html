<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة عمل - ميريديان للديكور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-page: #f4f4f7; 
            --text-main: #ffffff; 
            --accent-bronze: #cd9a63; 
            --card-deep-green: #112a2a; 
            --shadow-glass: rgba(0, 0, 0, 0.5);
            --glow: rgba(205, 154, 99, 0.5); 
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
            overflow: hidden;
        }

        .card-perspective {
            position: relative;
            perspective: 1000px;
            z-index: 10;
        }

        .decor-card {
            width: 320px; 
            height: 540px; 
            border-radius: 30px;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: url('https://images.unsplash.com/photo-1593062096033-9a26b09dd2f6?ixlib=rb-1.2.1&auto=format&fit=crop&w=600&q=80');
            background-size: cover;
            background-position: center;
            box-shadow: 0 15px 40px var(--shadow-glass);
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.6s ease; 
        }

        /* لایه رنگی و مات پس‌زمینه */
        .decor-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--card-deep-green);
            opacity: 0.85; 
            backdrop-filter: blur(2px);
            z-index: 1;
        }

        /* --- افکت نور شطرنجی هنگام هاور --- */
        .shine-effect {
            position: absolute;
            top: 0; left: -150%; width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.15), transparent);
            z-index: 4;
            transition: 0.6s;
            pointer-events: none;
        }

        .decor-card:hover .shine-effect {
            left: 150%;
        }

        .decor-card:hover {
            transform: rotateY(-15deg) rotateX(8deg) translateY(-5px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }

        .card-content {
            position: relative;
            width: 100%; height: 100%;
            z-index: 2; 
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 25px;
            text-align: center;
        }

        .logo-section {
            margin-top: 15px;
            margin-bottom: 25px;
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-wrapper {
            font-family: 'Playfair Display', serif;
            font-size: 55px;
            color: var(--accent-bronze);
            font-style: italic;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -2px;
            z-index: 10;
            animation: pulse-gold 4s infinite ease-in-out;
        }

        /* دایره اصلی ثابت */
        .circle-base {
            position: absolute;
            width: 110px;
            height: 110px;
            border: 2px solid rgba(205, 154, 99, 0.15);
            border-radius: 50%;
            z-index: 5;
        }

        /* حلقه نوری با چرخش بسیار نرم (10 ثانیه) */
        .circle-base::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%;
            padding: 2px;
            background: conic-gradient(from 0deg, transparent, var(--accent-bronze), transparent 25%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            animation: rotate-ring 10s linear infinite; /* چرخش بسیار نرم */
        }

        @keyframes rotate-ring {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulse-gold {
            0%, 100% { transform: scale(1); text-shadow: 0 0 5px var(--glow); }
            50% { transform: scale(1.05); text-shadow: 0 0 15px var(--glow); }
        }

        .brand-name {
            font-size: 28px;
            color: var(--text-main); 
            font-weight: 700;
            margin-bottom: 5px;
        }

        .service-type {
            font-size: 15px;
            color: rgba(255, 255, 255, 0.7); 
            font-weight: 600;
        }

        .divider {
            width: 30%;
            height: 1.5px;
            background: linear-gradient(to right, transparent, var(--accent-bronze), transparent);
            margin: 15px 0 35px 0;
        }

        .contact-info {
            width: 100%;
            text-align: right;
            margin-bottom: auto;
        }

        .info-row {
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 5px;
        }

        .info-row span.label {
            color: var(--accent-bronze);
            font-weight: 700;
            margin-left: 10px;
            min-width: 70px;
        }

        .info-row span.value {
            font-weight: 400;
            direction: ltr; 
        }

        .footer-tag {
            font-size: 12px;
            background-color: var(--accent-bronze); 
            color: var(--card-deep-green); 
            padding: 8px 25px; 
            border-radius: 20px; 
            font-weight: 700;
            margin-top: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card-perspective">
        <div class="decor-card">
            <div class="shine-effect"></div>
            
            <div class="card-content">
                
                <div class="logo-section">
                    <div class="circle-base"></div>
                    <div class="logo-wrapper">MD</div>
                </div>

                <div class="header">
                    <h1 class="brand-name">ميريديان للديكور</h1>
                    <p class="service-type">تنسيق وهندسة داخلية أوروبية</p>
                </div>

                <div class="divider"></div>

                <div class="contact-info">
                    <div class="info-row">
                        <span class="label">المصمم:</span> 
                        <span class="value">عمر الهاشمي</span>
                    </div>
                    <div class="info-row">
                        <span class="label">واتساب:</span> 
                        <span class="value">+966 500000000</span>
                    </div>
                    <div class="info-row">
                        <span class="label">البريد:</span> 
                        <span class="value">omar@meridian.sa</span>
                    </div>
                    <div class="info-row">
                        <span class="label">الموقع:</span> 
                        <span class="value">الرياض - حي العليا</span>
                    </div>
                </div>

                <div class="footer-tag">
                    فن عيش الحياة
                </div>
                
            </div>
        </div>
    </div>

</body>
</html>
